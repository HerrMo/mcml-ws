[project]
name = "windpower"
version = "0.1.0"
description = "Mock analysis of wind power generation in Germany, for teaching reproducible research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # lower bounds: oldest versions tested (CI job "test-lowest")
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.scripts]
windpower = "windpower.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.7.7",
    "mkdocstrings[python]>=1.0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "PD", "S"]
ignore = ["PD010"]  # prefer .pivot over .pivot_table

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--strict-markers", "-m", "not slow"]
markers = ["slow: runs on the full data set (deselected by default, run with -m slow)"]
