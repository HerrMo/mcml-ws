[project]
name = "windpower"
version = "0.1.0"
description = "Mock analysis of wind power generation in Germany, for teaching reproducible research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # lower bounds: oldest versions tested (CI job "test-lowest")
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.24",
    "pandas>=2.0",
    "pydantic>=2.4",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
]

[project.scripts]
windpower = "windpower.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
addopts = ["--doctest-modules", "--strict-markers", "-m", "not slow"]
markers = ["slow: runs on the full data set (deselected by default, run with -m slow)"]
