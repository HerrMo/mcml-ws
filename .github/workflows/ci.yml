name: CI

on:
  push:
    branches: [python]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Run pre-commit hooks
        run: uv run --locked pre-commit run --all-files --show-diff-on-failure

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install dependencies
        run: uv sync --locked
      - name: Run tests
        run: uv run pytest -m "slow or not slow" --cov=windpower --cov-report=term-missing

  # tests the lower bounds in pyproject.toml: every direct dependency is
  # installed at its oldest allowed version, on the oldest supported Python
  test-lowest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"
      - name: Run tests with lowest direct dependencies
        run: uv run --resolution lowest-direct --isolated pytest -m "slow or not slow"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Run analysis
        run: uv run --locked windpower --config config.yaml
      - uses: actions/upload-artifact@v7
        with:
          name: plots
          path: plots/
